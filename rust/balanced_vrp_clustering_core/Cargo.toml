[package]
name = "balanced_vrp_clustering_core"
version = "0.3.0"
edition = "2021"
description = "Rust core for balanced VRP k-means clustering"
license = "AGPL-3.0-or-later"

[features]
default = []
cli = ["dep:clap"]

[[bin]]
name = "bvrp-cluster"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
rand = "0.8"
rustc-hash = "2"

[dev-dependencies]
approx = "0.5"
